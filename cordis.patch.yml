# dsh-spend bundle patch — inserts the `usage-stats` row into the profile.
#
# The plugin ships a built-in provider knowledge base (17 providers / 159
# models, lib/knowledge.js): pricing and billing plans are auto-detected, so
# no config is required. To override anything, add a row with the same id
# (`usage-stats`) to your profile's cordis.patch.yml — the user layer is
# applied after bundle layers and the same-id row wins.
- insert:
    - id: usage-stats
      name: 'dsh-spend'
      config:
        currency: USD            # server-side base currency; the browser defaults to CNY display
        maxSessions: 20          # max rows in the by-session table
        maxRecentCalls: 50       # max recent calls
        seriesHours: 168         # time-series window in hours (zero-filled; UI offers 24h/72h/7d)
        refreshSeconds: 30       # floating-window auto-refresh interval (s)
        syncIntervalHours: 24    # ledger reconciliation cadence: re-scans the logs and re-prices
                                 # them against the CURRENT table. Prices are never fetched; they
                                 # ship in lib/knowledge.js or come from dashboard overrides.
        usdCnyRate: 7.2          # fixed FX used by the dashboard and principal ledger
        priceVersion: '2026-09-11'
        fxVersion: 'fixed-2026-08-21'
        liveRate: true           # host refreshes a live USD→CNY quote (6h cache) when reachable
        # 未定价模型禁用闸：默认关闭。开启后在 llm/stream waterfall 上拦截，
        # 任何解析不到价格行（会落到 defaultPricing）的模型在请求发出前被拒绝，
        # 而不是先花钱再在报表里显示「未计价」。判定与报表同源：管理员改价、
        # 知识库、同步行任一命中即放行。
        # allowModels 为豁免名单，写 `model` 或 `provider/model`，用于本地/免费路由。
        requirePricedModel:
          enabled: false
          allowModels: []
        # 联网价格同步：默认关闭。开启后按 intervalHours 拉取公开目录，只给
        # 「知识库和手工改价都没有覆盖到的模型」建价格行（fillUnpricedOnly），
        # 这正是仪表盘显示「未计价」的那些。每次观测写成一个 effectiveAt=抓取时刻
        # 的新 phase，历史一律按原 phase 计价，不重算。
        # 想让某家完全跟着目录走，把 provider 加进 providers 白名单——但要清楚
        # 公开目录不是厂商：它按自己的汇率折算人民币标价，也可能滞后厂商调价，
        # 两者在 2026-09-11 对 DeepSeek 都实测到了，所以 deepseek 不建议加。
        priceSync:
          enabled: false
          intervalHours: 24
          endpoint: https://openrouter.ai/api/v1/models
          timeoutMs: 20000
          fillUnpricedOnly: true   # true=只补空缺；false 时仍需 providers 白名单放行
          providers: []            # 全量同步白名单（canonical provider id）
        # pricing: [...]         # optional explicit per-model rates (overrides auto-detection)
        # plans: [...]           # optional explicit billing plans (overrides auto-detection)
        # usageEndpoints: [...]  # optional live quota/balance endpoint overrides (see README)
